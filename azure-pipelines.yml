trigger:
- main # Trigger on changes to the main branch

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '16.x' # Specify Node.js version
  displayName: 'Install Node.js'

- script: |
    npm install
    npm run build
  displayName: 'Build Project'

- task: AzureStaticWebApp@0
  inputs:
    azure_static_web_apps_api_token: $(deployment_token) # Deployment Token
    app_location: '/' # Location of your app code
    output_location: 'build' # Directory of the built app
